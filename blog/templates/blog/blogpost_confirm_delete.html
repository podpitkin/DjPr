{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удалить запись</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <nav aria-label="breadcrumb">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="{% url 'blog:post_list' %}">Блог</a></li>
                <li class="breadcrumb-item"><a href="{% url 'blog:post_detail' object.pk %}">{{ object.title }}</a></li>
                <li class="breadcrumb-item active" aria-current="page">Удаление</li>
            </ol>
        </nav>

        <div class="card-body">
            <h4 class="card-title">Вы уверены, что хотите удалить запись?</h4>
            <p class="card-text"> {{ object.title }}</p>

            <form method="post">
                {% csrf_token %}
                <div class="d-flex justify-content-between">
                    <a href="{% url 'blog:post_detail' object.pk %}" class="btn btn-secondary">Отмена</a>
                    <button type="submit" class="btn btn-danger">Да, удалить</button>
                </div>
            </form>
        </div>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
