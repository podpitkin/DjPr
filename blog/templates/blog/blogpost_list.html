{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блог</title>
    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
</head>
<body>
    <div class="container mt-4">
        <h1 class="mb-4">Блог</h1>
        <div class="mb-4">
            <a href="{% url 'blog:post_create' %}" class="btn btn-primary">Создать новую запись</a>
        </div>
        <div class="row">
            {% for post in posts %}
            <div class="col-md-6 mb-4">
                <div class="card h-100">
                    <img src="{{ post.preview.url }}" class="card-img-top" alt="{{ post.title }}" style="height: 200px; object-fit: cover;">
                    <div class="card-body">
                        <h5 class="card-title">{{ post.title }}</h5>
                        <p class="card-text">{{ post.content|truncatechars:150 }}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">{{ post.created_at|date:"d.m.Y H:i" }}</small>
                            <span class="badge bg-secondary">{{ post.views_count }} просмотров</span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-outline-primary btn-sm">Читать</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
